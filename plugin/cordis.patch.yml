- insert:
    - id: dsh-iconic-launcher
      name: 'dsh-iconic-launcher'
      config:
        shortcutName: DeepSeek Harness
        targetExecutable: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        targetArguments: >-
          -NoProfile -NonInteractive -Command "dsh web"
        allowUpload: true